# Rebuilds the site once after Diwali Night so the prerendered homepage metadata
# (title, description, share-card text) leads with New Year Night.
#
# The page itself already switches in the browser at 2:00 AM Chicago from the
# timestamps in src/data/events.ts. This run only refreshes what crawlers and
# link previews read from the static HTML. It runs mid-morning, after the door
# has closed. Hostinger builds from master, so the run pushes an empty commit;
# it also republishes the static mirror, since a GITHUB_TOKEN push does not
# start the deploy workflow.
name: Refresh after event transition

on:
  schedule:
    - cron: "0 16 8 11 *" # 2026-11-08 10:00 America/Chicago (CST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Only once, in 2026
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%Y)" = "2026" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.due.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.due.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.due.outputs.run == 'true'
        run: npm ci
      - if: steps.due.outputs.run == 'true'
        run: npm test
      - if: steps.due.outputs.run == 'true'
        run: npm run lint
      - if: steps.due.outputs.run == 'true'
        run: npm run typecheck
      - if: steps.due.outputs.run == 'true'
        run: npm run build

      - name: Ask Hostinger to rebuild
        if: steps.due.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: refresh prerendered homepage after the event transition"
          git push origin HEAD:master

      - name: Publish /out to deploy branch
        if: steps.due.outputs.run == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: deploy
          force_orphan: true
          commit_message: "Deploy ${{ github.sha }} (transition refresh)"
